<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        h1 {
            font-size: 3em;
            color: white;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        .buttons {
            position: relative;
            margin-top: 20px;
            width: 400px;
            height: 100px;
            display: flex;
            justify-content: space-around;
        }
        .btn {
            font-size: 1.5em;
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            border-radius: 30px;
            position: absolute;
            transition: transform 0.1s ease-out, background 0.3s;
            box-shadow: 3px 3px 15px rgba(0,0,0,0.2);
        }
        #yes {
            background-color: #6fdc6f;
            color: white;
            left: 50px;
            top: 20px;
        }
        #yes:hover {
            background-color: #5cb85c;
        }
        #no {
            background-color: #ff4d4d;
            color: white;
            left: 200px;
            top: 20px;
        }
        #wrong-answer, #right-answer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
        }
        #right-answer img {
            width: 900px;
            height: auto;
        }
        #wrong-answer img {
            width: 300px;
            height: auto;
        }
        #wrong-answer p, #right-answer p {
            color: white;
            font-size: 2em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine? 💖</h1>
    <div class="buttons">
        <button id="yes" class="btn" onclick="showRightAnswer()">Yes</button>
        <button id="no" class="btn" onclick="showWrongAnswer()">No</button>
    </div>
    
    <div id="wrong-answer">
        <img src="wrong.jpg" alt="Wrong Answer">
        <p>Wrong Answer!</p>
    </div>

    <div id="right-answer">
        <img src="correct.jpg" alt="Right Answer">
        <p>Oh no! You took too long, the cat ate your tiramisu</p>
    </div>

    <script>
        const noButton = document.getElementById("no");
        
        document.addEventListener("mousemove", function (event) {
            const mouseX = event.clientX;
            const mouseY = event.clientY;
            const rect = noButton.getBoundingClientRect();
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;
            
            const deltaX = btnCenterX - mouseX;
            const deltaY = btnCenterY - mouseY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            
            if (distance < 100) { // Moves away when mouse is close
                const moveX = (deltaX / distance) * 40;
                const moveY = (deltaY / distance) * 40;
                
                let newX = rect.left + moveX;
                let newY = rect.top + moveY;
                
                newX = Math.max(0, Math.min(window.innerWidth - rect.width, newX));
                newY = Math.max(0, Math.min(window.innerHeight - rect.height, newY));
                
                noButton.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });
        
        function showWrongAnswer() {
            const wrongAnswer = document.getElementById("wrong-answer");
            wrongAnswer.style.display = "flex";
            setTimeout(() => {
                wrongAnswer.style.display = "none";
            }, 1000);
        }
        
        function showRightAnswer() {
            const rightAnswer = document.getElementById("right-answer");
            rightAnswer.style.display = "flex";
            setTimeout(() => {
                rightAnswer.style.display = "none";
            }, 2000);
        }
    </script>
</body>
</html>
